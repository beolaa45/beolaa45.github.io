name: Publish website and Bep Nho 3D
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download GitHub source archive (avoids broken submodule)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip" -o repo.zip
          mkdir -p downloaded _site
          unzip -q repo.zip -d downloaded
          cp -a downloaded/*/. _site/
          rm -rf _site/.github
          touch _site/.nojekyll
          test -s _site/bep-nho-3d/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
